<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurbineIQ · Emission Journey</title>
<style>
:root{
  /* OPTIONAL: use your own photo as background. Example: --photo:url('/static/turbine.jpg'); --photo-op:.5; */
  --photo:none;--photo-op:0;
  --ink:#1d1a3a;--muted:#675f91;--card:rgba(255,255,255,.74);--cardb:rgba(255,255,255,.95);--field:rgba(255,255,255,.8);
  --g1:#ff6b6b;--g2:#7c5cff;--sc:#7c5cff;--mx:0;--my:0;--res:#7c5cff;
  --metal1:#8793c4;--metal2:#e4e9ff;--cloud:rgba(255,255,255,.92);--streak:#fff;--bladeh:#7a2b1f;--hubh:#3a1410;--pyl:#4a5a8f;--bolt:#fff6a8;
  --tw1:#dfe6fc;--tw2:#b6c3ee;--win:#aebbe6;--hill1:#c8d4f5;--hill2:#abbaea;
  --plume:#ffffff;--plumeop:.7;--drift:40px;--grow:2.6;--alert:#ff3b3b;--alertop:0;
  --s1a:#79cdff;--s1b:#ffe8d4;--s2a:#a9b7ff;--s2b:#f0eaff;--s3a:#ffb86f;--s3b:#ff6644;--s4a:#ffd1a1;--s4b:#ff7b5e;--s5a:#9be9d4;--s5b:#5bd2b2;--s6a:#a6dcff;--s6b:#fff0d8}
[data-theme=dark]{
  --ink:#f4f1ff;--muted:#a9a3d6;--card:rgba(12,10,36,.62);--cardb:rgba(255,255,255,.14);--field:rgba(255,255,255,.07);
  --g1:#ff8a4c;--g2:#c04cff;--metal1:#5f6fb0;--metal2:#26306e;--cloud:rgba(125,145,255,.13);--streak:#9bb4ff;--bladeh:#2a0d10;--hubh:#12060a;--pyl:#070b2b;--bolt:#7ffcff;
  --tw1:#1e2468;--tw2:#12175a;--win:#ffd166;--hill1:#10145a;--hill2:#0a0d3c;
  --s1a:#080d2e;--s1b:#1c3170;--s2a:#0a0b38;--s2b:#2a2f9c;--s3a:#2b0905;--s3b:#a52c08;--s4a:#1a0508;--s4b:#7c1212;--s5a:#031a1e;--s5b:#0d5253;--s6a:#080b26;--s6b:#2b1848}
html[data-theme=light] body[data-level=normal]{--s6a:#8fdcff;--s6b:#e4fff1}
html[data-theme=dark] body[data-level=normal]{--s6a:#051a2c;--s6b:#0f5350}
html[data-theme=light] body[data-level=warning]{--s6a:#ffe3a3;--s6b:#ffb64d}
html[data-theme=dark] body[data-level=warning]{--s6a:#2b1a00;--s6b:#7d4b00}
html[data-theme=light] body[data-level=critical]{--s6a:#ffb9a3;--s6b:#ff7b7b}
html[data-theme=dark] body[data-level=critical]{--s6a:#1b0000;--s6b:#7e1010}
body[data-level=normal]{--res:#19c37d}
body[data-level=warning]{--res:#f5a300;--plume:#d6b27a;--plumeop:.8;--drift:90px;--grow:3.2}
body[data-level=critical]{--res:#ff3b3b;--plume:#2b2a33;--plumeop:.92;--drift:170px;--grow:4.3;--alertop:.6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:'Segoe UI Variable Display','Segoe UI','Helvetica Neue',Arial,sans-serif;overflow:hidden;background:#111}
.scene{position:fixed;inset:0;z-index:0;overflow:hidden}
.photo{position:absolute;inset:0;background:var(--photo) center/cover no-repeat;opacity:var(--photo-op);z-index:2;mix-blend-mode:soft-light}
.sc{position:absolute;inset:0;opacity:0;transform:scale(1.12);transition:opacity 1.1s ease,transform 1.8s ease}
.sc.on{opacity:1;transform:scale(1)}
.sc svg{width:100%;height:100%;display:block;transform:translate(calc(var(--mx)*-18px),calc(var(--my)*-12px)) scale(1.06);transition:transform .35s ease-out}
.shade{position:absolute;inset:0;z-index:3;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 55%)}
[data-theme=light] .shade{background:linear-gradient(90deg,rgba(255,255,255,.28),transparent 55%)}

/* scene art */
.casing{fill:none;stroke:var(--metal1);stroke-width:16}.casing.thin{stroke-width:4;opacity:.7}
.blade{stroke:var(--metal1);stroke-width:2}
.hubin{fill:var(--metal1);opacity:.9}
.spin{animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{fill:var(--cloud);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
.streak{stroke:var(--streak);stroke-width:3;stroke-linecap:round;opacity:0;animation:wind linear infinite}
@keyframes wind{from{transform:translateX(-340px);opacity:0}15%{opacity:.7}to{transform:translateX(900px);opacity:0}}
.ring{fill:none;stroke:var(--metal1);opacity:.9;animation:spin linear infinite}
.squeeze{fill:none;stroke:#fff;stroke-width:3;opacity:0;animation:squeeze 3.4s ease-in infinite}
@keyframes squeeze{from{transform:scale(1);opacity:.7}to{transform:scale(.1);opacity:0}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.fl{animation:flick .55s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(.88,.94) skewX(-4deg)}to{transform:scale(1.08,1.12) skewX(4deg)}}
.ember{fill:#ffd166;opacity:0;animation:ember linear infinite}
@keyframes ember{from{transform:translate(0,0);opacity:0}10%{opacity:1}to{transform:translate(var(--dx),-820px);opacity:0}}
.rim{fill:none;stroke:#ffb347;stroke-width:12;opacity:.9}.rim.thin{stroke-width:3;stroke:#fff3bf}
.bladeh{fill:var(--bladeh);stroke:#ff9d4d;stroke-width:2.5}
.hubh{fill:var(--hubh)}
.spark{stroke:#ffe08a;stroke-width:4;stroke-linecap:round;animation:spk .8s ease-in-out infinite alternate}
@keyframes spk{from{opacity:.1}to{opacity:1}}
.field{fill:none;stroke:var(--bolt);stroke-width:2.5;stroke-dasharray:14 16;opacity:.7;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-60}}
.wave{fill:none;stroke:var(--bolt);stroke-width:3;opacity:0;animation:wave 3s ease-out infinite}
@keyframes wave{from{transform:scale(1);opacity:.8}to{transform:scale(3.2);opacity:0}}
.bolticon{filter:drop-shadow(0 0 18px var(--bolt));animation:zap 1.4s infinite}
@keyframes zap{50%{opacity:.55}}
.bolt{fill:none;stroke:var(--bolt);stroke-width:5;stroke-linejoin:round;opacity:0;animation:flash 5s infinite;filter:drop-shadow(0 0 10px var(--bolt))}
@keyframes flash{0%,90%,100%{opacity:0}92%{opacity:1}94%{opacity:.15}96%{opacity:1}}
.pyl{fill:none;stroke:var(--pyl);stroke-width:5;stroke-linecap:round}
.wire5{fill:none;stroke:var(--pyl);stroke-width:2.5}
.twl{fill:none;stroke:rgba(255,255,255,.35);stroke-width:4;stroke-linecap:round}
.plume{fill:var(--plume);opacity:0;animation:rise 8.4s ease-out infinite}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}18%{opacity:var(--plumeop)}100%{opacity:0;transform:translate(var(--drift),-380px) scale(var(--grow))}}
.alert{opacity:var(--alertop);animation:alertp 1.1s ease-in-out infinite}
@keyframes alertp{50%{opacity:calc(var(--alertop)*.4)}}
.win{fill:var(--win);opacity:.4}
[data-theme=dark] .win{opacity:1;filter:drop-shadow(0 0 5px #ffd166)}
.sunc{fill:#fff3c0;filter:drop-shadow(0 0 40px #ffd86b)}.moonc{fill:#f4f1ff;filter:drop-shadow(0 0 36px #9aa6ff);opacity:0}
[data-theme=dark] .sunc{opacity:0}[data-theme=dark] .moonc{opacity:1}
.stars{opacity:0}[data-theme=dark] .stars{opacity:1}.stars circle{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}

/* UI */
.app{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;padding:18px clamp(14px,4vw,56px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:1.35rem}
.brand i{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;font-style:normal;box-shadow:0 8px 24px color-mix(in srgb,var(--g2) 50%,transparent)}
.brand b{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sw{width:78px;height:38px;border-radius:30px;border:1px solid var(--cardb);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:space-around;color:var(--ink);font-size:1rem;padding:0}
.sw i{font-style:normal;z-index:1}
.knob{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
[data-theme=dark] .knob{transform:translateX(40px)}
.path{display:flex;align-items:center;margin:18px 0 0;max-width:720px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;font:inherit;opacity:.65}
.node span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--card);border:1px solid var(--cardb);backdrop-filter:blur(10px);transition:.35s}
.node small{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.node.done span{background:var(--c);color:#fff;border-color:transparent}
.node.on{opacity:1}.node.on span{background:var(--c);color:#fff;border-color:transparent;transform:scale(1.2);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 28%,transparent)}
.node:disabled{cursor:default;opacity:.35}
.line{flex:1;height:3px;border-radius:3px;background:var(--cardb);margin:0 6px 18px;position:relative;overflow:hidden;min-width:10px}
.line i{position:absolute;inset:0;background:linear-gradient(90deg,var(--g1),var(--g2));transform:scaleX(0);transform-origin:left;transition:transform .6s}
.line.fill i{transform:scaleX(1)}
.stage{flex:1;display:flex;align-items:center;min-height:0}
.card{position:relative;width:min(540px,100%);max-height:calc(100vh - 190px);overflow:auto;padding:30px;border-radius:34px;background:var(--card);border:1px solid var(--cardb);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);box-shadow:0 30px 80px rgba(20,10,60,.28)}
.card.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.step{display:none}
.step.active{display:block;animation:slide .55s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{opacity:0;transform:translateX(34px)}}
.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--sc)}
h2{margin:6px 0 6px;font-size:clamp(2.4rem,6vw,3.7rem);line-height:1;letter-spacing:-.045em;font-weight:900;background:linear-gradient(90deg,var(--ink),var(--sc));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 20px;color:var(--muted);font-size:1.02rem;line-height:1.45}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.fld{display:block;position:relative}
.fld>span{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 4px}
.fld div{position:relative}
input{width:100%;padding:15px 62px 15px 16px;font-size:1.5rem;font-weight:600;border-radius:18px;border:2px solid transparent;background:var(--field);color:var(--ink);outline:none;transition:.25s;font-family:inherit}
input:focus{border-color:var(--sc);box-shadow:0 0 0 6px color-mix(in srgb,var(--sc) 22%,transparent)}
input.bad{border-color:#ff4d4d;background:rgba(255,77,77,.12)}
input::placeholder{color:var(--muted);opacity:.45;font-weight:500}
.fld em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.72rem;font-weight:700;padding:4px 8px;border-radius:10px;background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--sc)}
.nav{display:flex;gap:12px;margin-top:24px}
.btn{border:0;border-radius:18px;padding:15px 26px;font:inherit;font-weight:800;font-size:1.02rem;cursor:pointer;transition:transform .15s,filter .2s,box-shadow .2s}
.btn.pri{flex:1;color:#fff;background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 12px 30px color-mix(in srgb,var(--g2) 45%,transparent)}
.btn.pri:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.pri:active{transform:scale(.98)}
.btn.pri:disabled{opacity:.6}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.ghost:hover{background:var(--cardb)}
.hide{display:none!important}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.chip{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;border-radius:14px;background:var(--field);border-left:5px solid var(--c)}
.chip small{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.chip b{font-size:1.1rem}
.msg{color:#ff4d4d;font-weight:700;margin:14px 0 0}
.result{display:none;text-align:center;animation:slide .6s}
.result.show{display:block}
.result .eyebrow{color:var(--muted)}
.big{margin:8px 0;font-size:clamp(3.2rem,11vw,5.6rem);line-height:1;font-weight:900;letter-spacing:-.05em;color:var(--res);text-shadow:0 0 40px color-mix(in srgb,var(--res) 50%,transparent);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.dots{display:flex;justify-content:center;gap:10px;margin:6px 0 12px}
.dots i{width:16px;height:16px;border-radius:50%;opacity:.22}
.dots .n{background:#19c37d}.dots .w{background:#f5a300}.dots .c{background:#ff3b3b}
body[data-level=normal] .dots .n,body[data-level=warning] .dots .w,body[data-level=critical] .dots .c{opacity:1;box-shadow:0 0 18px currentColor;transform:scale(1.3)}
.dots .n{color:#19c37d}.dots .w{color:#f5a300}.dots .c{color:#ff3b3b}
.note{color:var(--muted);font-size:1.1rem;margin:0 0 20px}
.bignum{position:fixed;z-index:1;right:3vw;bottom:-2vh;font-size:min(34vw,430px);line-height:.8;font-weight:900;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.55);pointer-events:none;transition:.5s;opacity:.7}
[data-theme=dark] .bignum{-webkit-text-stroke-color:rgba(255,255,255,.22)}
body.alarm::after,body.caution::after{content:"";position:fixed;inset:0;z-index:9;pointer-events:none;animation:vig 1.1s ease-in-out infinite}
body.alarm::after{box-shadow:inset 0 0 160px 30px rgba(255,40,40,.5)}
body.caution::after{box-shadow:inset 0 0 130px 20px rgba(245,184,0,.4)}
@keyframes vig{50%{opacity:.25}}
@media(max-width:760px){
  .stage{align-items:flex-end}.card{max-height:68vh;padding:22px;border-radius:28px 28px 20px 20px;width:100%}
  .node small{display:none}.path{margin-top:12px}.bignum{top:84px;bottom:auto;font-size:44vw}
  h2{font-size:2.3rem}.fields{grid-template-columns:1fr 1fr}input{font-size:1.2rem;padding:12px 44px 12px 12px}.fld em{right:8px}
}
@media(max-width:420px){.fields{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="brand"><i>⚙</i><span>Turbine<b>IQ</b></span></div>
    <button id="theme" class="sw" type="button" aria-label="Switch light or dark mode"><span class="knob"></span><i>☀</i><i>☾</i></button>
  </header>
  <nav class="path" id="path"></nav>
  <main class="stage">
    <form id="f" class="card" id="card" novalidate autocomplete="off">
      <div id="steps"></div>
      <div class="result" id="result">
        <div class="eyebrow">Emission class</div>
        <div class="big" id="label">—</div>
        <div class="dots"><i class="c"></i><i class="w"></i><i class="n"></i></div>
        <p class="note" id="note"></p>
        <button type="button" class="btn pri" id="again">Start again</button>
      </div>
      <div class="nav" id="nav"><button type="button" class="btn ghost hide" id="back">← Back</button><button type="submit" class="btn pri" id="next">Next →</button></div>
      <p class="msg" id="msg"></p>
    </form>
  </main>
</div>

<script>
const STEPS=[
 {t:"Intake",c:"#2bb8e8",d:"Air comes in from outside. How does the air look today?",f:[["AT","Ambient Temp","°C"],["AP","Ambient Pressure","mbar"],["AH","Ambient Humidity","%"],["AFDP","Air Filter Diff. Pressure","mbar"]]},
 {t:"Compressor",c:"#6c7bff",d:"The air is squeezed very hard. How strong is the squeeze?",f:[["CDP","Compressor Discharge Pressure","mbar"]]},
 {t:"Combustor",c:"#ff7a1a",d:"Fuel burns here and the gas gets very hot. How hot is it?",f:[["TIT","Turbine Inlet Temp","°C"]]},
 {t:"Turbine",c:"#ff4d4d",d:"Hot gas spins the blades. Check the pressure and heat after.",f:[["GTEP","Exhaust Pressure","mbar"],["TAT","Turbine After Temp","°C"]]},
 {t:"Generator",c:"#12b886",d:"The spin becomes power. Add the energy made and the year.",f:[["TEY","Turbine Energy Yield","MWh"],["Year","Year",""]]},
 {t:"Predict",c:"#a855f7",d:"Check your numbers. Then press Predict.",f:[]}
];
const $=id=>document.getElementById(id), F=$('f'), root=document.documentElement, card=F;
const ALL=STEPS.flatMap(s=>s.f);
let cur=0,max=0;

/* build steps */
$('steps').innerHTML=STEPS.map((s,i)=>`<section class="step" data-i="${i}" style="--sc:${s.c}">
 <div class="eyebrow">Step ${i+1} of ${STEPS.length}</div><h2>${s.t}</h2><p class="sub">${s.d}</p>
 ${i<5?`<div class="fields">${s.f.map(([k,n,u])=>`<label class="fld"><span>${n}</span><div><input name="${k}" type="number" step="any" placeholder="${k}" inputmode="decimal">${u?`<em>${u}</em>`:''}</div></label>`).join('')}</div>`:`<div class="chips" id="chips"></div>`}
</section>`).join('');

/* progress path */
$('path').innerHTML=STEPS.map((s,i)=>`<button type="button" class="node" data-i="${i}" style="--c:${s.c}"><span>${i+1}</span><small>${s.t}</small></button>${i<STEPS.length-1?'<div class="line"><i></i></div>':''}`).join('');
document.querySelectorAll('.node').forEach(n=>n.onclick=()=>{const i=+n.dataset.i;if(i<=max&&!resultShown)go(i)});

/* theme */
function setTheme(t){root.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('theme').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');

/* mouse parallax */
addEventListener('pointermove',e=>{root.style.setProperty('--mx',((e.clientX/innerWidth-.5)*2).toFixed(3));root.style.setProperty('--my',((e.clientY/innerHeight-.5)*2).toFixed(3))});

let resultShown=false;
function render(){
  document.querySelectorAll('.step').forEach(s=>s.classList.toggle('active',+s.dataset.i===cur));
  document.querySelectorAll('.sc').forEach((s,i)=>s.classList.toggle('on',i===cur));
  document.querySelectorAll('.node').forEach((n,i)=>{n.classList.toggle('on',i===cur);n.classList.toggle('done',i<cur);n.disabled=i>max});
  document.querySelectorAll('.line').forEach((l,i)=>l.classList.toggle('fill',i<cur));
  root.style.setProperty('--sc',STEPS[cur].c);
  $('bignum').textContent=String(cur+1).padStart(2,'0');
  $('back').classList.toggle('hide',cur===0);
  $('next').textContent=cur===5?'Predict ✨':'Next →';
  if(cur===5)$('chips').innerHTML=ALL.map(([k,n,u])=>{const s=STEPS.find(x=>x.f.some(y=>y[0]===k));return `<div class="chip" style="--c:${s.c}"><small>${k}</small><b>${F.elements[k].value||'—'} <small>${u}</small></b></div>`}).join('');
  const first=document.querySelector(`.step[data-i="${cur}"] input`);if(first)setTimeout(()=>first.focus({preventScroll:true}),350);
}
function go(i){cur=i;max=Math.max(max,i);$('msg').textContent='';render()}
function valid(i){
  const inputs=[...document.querySelectorAll(`.step[data-i="${i}"] input`)];let bad=null;
  inputs.forEach(x=>{const ok=x.value.trim()!==''&&x.checkValidity();x.classList.toggle('bad',!ok);if(!ok&&!bad)bad=x});
  if(bad){card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');bad.focus()}
  return !bad;
}
$('back').onclick=()=>go(cur-1);

/* result */
const level=l=>{l=String(l).toLowerCase();return l.includes('crit')?'critical':l.includes('warn')?'warning':l.includes('norm')?'normal':'other'};
const NOTES={normal:'Good news. The emission level looks safe.',warning:'Be careful. The emission level needs attention.',critical:'Danger. Check the turbine now.',other:'Prediction done.'};
function showResult(label){
  const lv=level(label);resultShown=true;
  document.body.dataset.level=lv;document.body.classList.toggle('alarm',lv==='critical');document.body.classList.toggle('caution',lv==='warning');
  $('label').textContent=label;$('note').textContent=NOTES[lv];
  $('steps').classList.add('hide');$('nav').classList.add('hide');$('result').classList.add('show');
}
$('again').onclick=()=>{
  resultShown=false;delete document.body.dataset.level;document.body.classList.remove('alarm','caution');
  F.reset();$('steps').classList.remove('hide');$('nav').classList.remove('hide');$('result').classList.remove('show');
  cur=0;max=0;render();
};

F.addEventListener('submit',async e=>{
  e.preventDefault();
  if(cur<5){if(valid(cur))go(cur+1);return}
  for(let i=0;i<5;i++){if(!valid(i)){go(i);return}}
  const data={};ALL.forEach(([k])=>data[k]=parseFloat(F.elements[k].value));
  const btn=$('next');btn.disabled=true;$('msg').textContent='';
  try{
    const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Something went wrong');
    showResult(j.prediction);
  }catch(err){$('msg').textContent='⚠ '+err.message+' (is the Flask server running?)'}
  btn.disabled=false;
});
render();
</script>
</body>
</html>
